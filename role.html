<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GS Platform — Choose Your Role</title>

    <link rel="stylesheet" href="role.css">
</head>

<body>

    <main class="role-page">

        <div class="role-container">

            <div class="brand">
                <div class="brand-mark">GS</div>
                <span>GS Platform</span>
            </div>

            <div class="step-label">
                STEP 1 OF 2
            </div>

            <h1>Welcome to GS Platform</h1>

            <p class="subtitle">
                How would you like to use GS Platform?
            </p>


            <div class="role-options">

                <!-- FREELANCER -->

                <button
                    type="button"
                    id="freelancerCard"
                    class="role-card"
                >

                    <div class="role-icon">✦</div>

                    <div class="role-content">

                        <h2>I'm a Freelancer</h2>

                        <p>
                            Offer your skills, showcase your work,
                            and work with clients.
                        </p>

                    </div>

                    <span class="arrow">→</span>

                </button>


                <!-- CLIENT -->

                <button
                    type="button"
                    id="clientCard"
                    class="role-card"
                >

                    <div class="role-icon">◆</div>

                    <div class="role-content">

                        <h2>I'm a Client</h2>

                        <p>
                            Find skilled professionals and hire
                            the right person for your project.
                        </p>

                    </div>

                    <span class="arrow">→</span>

                </button>

            </div>


            <p
                id="statusMessage"
                class="status-message"
            ></p>

        </div>

    </main>


    <!-- Loading screen -->

    <div
        id="loadingOverlay"
        class="loading-overlay"
    >

        <div class="loader"></div>

        <p id="loadingText">
            Setting up your account...
        </p>

    </div>


    <!-- Supabase -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- This page's JavaScript -->

    <script src="role.js"></script>

</body>
</html>
